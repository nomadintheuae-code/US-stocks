# SENTINEL PRO - Configuration
# All tunable parameters should be defined here.
# Environment-specific values and secrets go in .env (not committed).

# ==============================================================================
# CAPITAL & POSITION MANAGEMENT
# ==============================================================================
capital:
  jpy: 1000000              # 運用資金（円）
  max_positions: 20         # 最大同時保有数
  account_risk_pct: 0.015   # 1トレードあたりリスク (1.5%)
  max_same_sector: 2        # セクターあたり最大銘柄数
  max_position_pct: 0.40    # 1ポジション最大（総資金の40%）

# ==============================================================================
# SCAN FILTERS
# ==============================================================================
scan:
  min_rs_rating: 70         # RS最低スコア（0-99 パーセンタイル）
  min_vcp_score: 55         # VCP最低スコア（0-105）
  min_profit_factor: 1.1    # バックテスト最低プロフィットファクター

# ==============================================================================
# EXIT STRATEGY
# ==============================================================================
exit:
  stop_loss_atr: 2.0        # 損切り = ATR × この値
  target_r_multiple: 2.5    # 利確 = リスク × この値 (R-multiple)

# ==============================================================================
# VCP PARAMETERS
# ==============================================================================
vcp:
  # Tightness (収縮度合い) - periods for range calculation
  tightness_periods: [20, 30, 40, 60]
  # Volume dry-up comparison windows
  volume_lookback_short: 20    # 直近出来高期間
  volume_lookback_long: 60     # 比較対象出来高期間（直近を除く）
  volume_lookback_gap: 20      # 直近と比較期間の間のギャップ
  # MA Alignment periods
  ma_periods: [50, 150, 200]
  # Pivot distance thresholds for bonus points
  pivot_near_pct: 0.04         # 0-4% = 5pt bonus
  pivot_far_pct: 0.08          # 4-8% = 3pt bonus
  # Scoring weights (max 105)
  max_tightness_score: 40
  max_volume_score: 30
  max_ma_score: 30
  max_pivot_bonus: 5

# ==============================================================================
# RS PARAMETERS
# ==============================================================================
rs:
  # Lookback windows in trading days
  windows: [252, 126, 63, 21]  # 12m, 6m, 3m, 1m
  # Weights for each window (must sum to 1.0)
  weights: [0.4, 0.2, 0.2, 0.2]
  # Minimum data required (days)
  min_data_days: 21

# ==============================================================================
# STRATEGY VALIDATOR (Backtest) PARAMETERS
# ==============================================================================
backtest:
  lookback_bars: 250         # バックテスト対象期間（バー数）
  min_bars_for_entry: 50     # エントリー判定に必要な最小バー数
  pivot_lookback: 20         # ピボット計算用ルックバック
  ma_filter_period: 50       # MAフィルター期間

# ==============================================================================
# SES (Sentinel Efficiency Score) PARAMETERS
# ==============================================================================
ses:
  period: 20                 # 計算期間
  # Fractal Efficiency thresholds
  fe_thresholds: [0.60, 0.50, 0.40, 0.30]
  fe_scores: [30, 25, 20, 10]
  # True Force Index thresholds
  force_thresholds: [0.80, 0.65, 0.55]
  force_scores: [30, 20, 10]
  # Volatility Squeeze thresholds
  vol_contraction_thresholds: [0.50, 0.65, 0.80, 1.20]
  vol_contraction_scores: [20, 15, 10, -5]
  # Bar Quality thresholds
  clv_thresholds: [0.60, 0.55, 0.50]
  body_thresholds: [0.10, 0.00]
  bar_scores: [20, 15, 10]

# ==============================================================================
# ECR STRATEGY PARAMETERS
# ==============================================================================
ecr:
  # Component weights for Sentinel Rank
  vcp_weight: 0.4
  ses_weight: 0.3
  rs_weight: 0.3
  # Rank bonuses
  vcp_ses_bonus_high: 1.15   # VCP≥95 & SES≥80
  vcp_ses_bonus_mid: 1.05    # VCP≥85 & SES≥70
  # Phase detection thresholds
  ignition_rank_delta: 15
  ignition_rank_slope: 3
  ignition_vol_ratio: 1.8
  accumulation_rank: 80
  accumulation_rank_slope: 2
  accumulation_dist_max: 0.08
  release_dist: -0.07
  release_rank_slope: 0

# ==============================================================================
# CACHE SETTINGS
# ==============================================================================
cache:
  price_expiry_hours: 12         # 価格キャッシュ有効期限
  fundamental_expiry_hours: 24   # ファンダメンタルキャッシュ
  news_expiry_hours: 1           # ニュースキャッシュ
  insider_expiry_hours: 6        # インサイダー取引キャッシュ
  sector_expiry_days: 30         # セクター情報キャッシュ
  compression: "zstd"            # 圧縮方式: zstd, lz4, gzip, none

# ==============================================================================
# PERFORMANCE SETTINGS
# ==============================================================================
performance:
  max_workers: 3                 # 最大並列ワーカー数（I/O bound用）
  batch_size: 50                 # yfinanceバッチ取得サイズ
  request_timeout: 15            # HTTPリクエストタイムアウト（秒）
  rate_limit_delay: 0.1          # API呼び出し間遅延（秒）

# ==============================================================================
# DATA SOURCE SETTINGS
# ==============================================================================
data:
  default_period: "700d"         # デフォルト取得期間
  min_bars_required: 150         # 最低必要バー数
  auto_adjust: true              # 分割・配当調整
  repair: true                   # データ修復
  # Universe settings
  universe_file: ""              # 外部ユニバースファイル（空なら内蔵）
  filter_delisted: true          # 上場廃止銘柄を除外

# ==============================================================================
# MULTI-MARKET SUPPORT (Phase 7) — OPT-IN, DISABLED BY DEFAULT
# ==============================================================================
# Enable additional markets (crypto, forex) beyond the default US stock universe.
# While disabled, the scanner uses the existing TICKERS list unchanged.
markets:
  enabled: false                 # マルチマーケット有効化（既定で無効）
  markets_list: []
    # ── Example: Crypto market ──
    # - name: "Crypto"
    #   type: "crypto"
    #   enabled: true
    #   tickers:
    #     - "BTC-USD"
    #     - "ETH-USD"
    #     - "SOL-USD"
    #     - "BNB-USD"
    #     - "XRP-USD"
    #   period: "700d"
    #   min_bars: 100
    #   sector_label: "Cryptocurrency"
    # ── Example: Forex market ──
    # - name: "Forex"
    #   type: "forex"
    #   enabled: true
    #   tickers:
    #     - "EURUSD=X"
    #     - "GBPUSD=X"
    #     - "USDJPY=X"
    #     - "AUDUSD=X"
    #   period: "700d"
    #   min_bars: 100
    #   sector_label: "Forex"

# ==============================================================================
# FILTERS & RANKING (Phase 4) — OPT-IN, DISABLED BY DEFAULT
# ==============================================================================
# All filters are additive and OFF unless `enabled: true`. While disabled, the
# scanner's default behavior (310/30/15) is byte-for-byte unchanged.
filters:
  enabled: true                  # フィルタ有効化
  liquidity:
    min_avg_dollar_volume: null  # 最低平均出来高 (USD/日)
    min_avg_volume: null         # 最低平均出来高 (株/日)
  market_cap:
    min_usd: null                # 最低時価総額 (USD)
    max_usd: null                # 最高時価総額 (USD)
  price:
    min_price: 2.0              # 最低価格 (USD)
    max_price: 50.0             # 最高価格 (USD)
  sector:
    include: []                  # 許可セクター（空なら全て）
    exclude: []                  # 除外セクター
  fundamental:
    min_revenue_growth: null     # 最低売上成長率 (revenueGrowth)
    min_earnings_growth: null    # 最低利益成長率 (earningsGrowth)
    max_forward_pe: null         # 最高予想PER (forwardPE)
    min_analyst_count: null      # 最低アナリスト数
  earnings:
    exclude_days_before: null    # 決算日前N日以内を除外 (default: 7)
    include_days_ahead: null     # 決算日N日以内のみ含む (mutually exclusive with exclude)

# ==============================================================================
# PIPELINE (Phase 6) — OPT-IN, DISABLED BY DEFAULT
# ==============================================================================
# Integrated pipeline orchestrator (engines/pipeline.py). All features are
# additive and OFF unless explicitly enabled. While `enabled: false`, the
# scanner's default behavior (310/30/15) is byte-for-byte unchanged.
pipeline:
  enabled: false                 # パイプライン有効化（既定で無効）
  rs: "legacy"                   # RSプロバイダ: legacy (RSAnalyzer) | benchmark (RelativeStrengthRanking)
  strategies:
    vcp_breakout: false          # VCPブレイクアウト戦略（既定で無効）
    minervini: false             # ミネルヴィニ・テンプレート戦略（既定で無効）
  backtest:
    enabled: false               # バックテスト付加レコード（既定で無効）

# ==============================================================================
# TECHNICAL PATTERNS (Phase 8) — OPT-IN, DISABLED BY DEFAULT
# ==============================================================================
# Additive pattern recognition engines (Fibonacci, candlestick, BB squeeze).
# All features are OFF unless explicitly enabled. While disabled, the
# scanner's default behavior (310/30/15) is byte-for-byte unchanged.
patterns:
  enabled: false                 # パターンエンジン有効化（既定で無効）
  fibonacci:
    lookback: 60                 # フィボナッチ・スイング検出ルックバック
  candlestick:
    lookback: 5                  # ローソク足パターン検出バー数
    doji_threshold: 0.1          # ドジー判定閾値（ボディ/レンジ比）
    marubozu_threshold: 0.9      # まるぼう判定閾値（ボディ/レンジ比）
  bb_squeeze:
    period: 20                   # ボリンジャーバンド期間
    std_dev: 2.0                 # ボリンジャーバンド標準偏差
    percentile_threshold: 20.0   # スクイーズ判定パーセンタイル閾値

# ==============================================================================
# MARKET REGIME (Phase 9) — OPT-IN, DISABLED BY DEFAULT
# ==============================================================================
# Market regime detection engine (bull/bear/sideways/transition).
# Uses SPY/QQQ as benchmark indices for rule-based regime classification.
# While disabled, the scanner's default behavior (310/30/15) is unchanged.
regime:
  enabled: false                 # レジームエンジン有効化（既定で無効）
  benchmark: "SPY"               # ベンチマーク銘柄
  weights:
    trend: 0.35                  # トレンド信号の重み
    breadth: 0.25                # ブレッドスIGNALの重み
    volatility: 0.20             # ボラティリティ信号の重み
    momentum: 0.20               # モメンタム信号の重み

# ==============================================================================
# ENHANCED RISK MANAGEMENT (Phase 10) — OPT-IN, DISABLED BY DEFAULT
# ==============================================================================
# Portfolio-level risk analysis, ATR-based sizing, dynamic stops.
# While disabled, the scanner's default behavior (310/30/15) is unchanged.
risk:
  enabled: false                 # リスク管理有効化（既定で無効）
  position_sizing:
    risk_per_trade_pct: 0.015    # 1トレードあたりリスク比率
    stop_atr_multiplier: 2.0     # ATRストップ乗数
    atr_period: 14               # ATR計算期間
  portfolio:
    max_heat_pct: 0.06           # ポートフォリオ最大リスクヘート
    max_sector_pct: 0.40         # セクター最大集中度
    max_correlation: 0.70        # 相関警告閾値
  stops:
    trailing_pct: 0.05           # トレーリングストップ%
    max_days_in_trade: 20        # タイムストップ日数
    profit_time_threshold: 0.05  # タイムストップ回避閾値

# ==============================================================================
# NOTIFICATION SETTINGS
# ==============================================================================
notification:
  line_enabled: false            # LINE通知有効化（トークン設定時のみ）
  line_chunk_size: 4000          # LINEメッセージ分割サイズ

# ==============================================================================
# CSV/EXCEL EXPORT (Phase 8) — OPT-IN, DISABLED BY DEFAULT
# ==============================================================================
# Scan result export to CSV and Excel files in ./results/.
# While disabled, no export files are created.
export:
  enabled: false                 # CSV/Excel出力有効化（既定で無効）
  csv: true                      # CSV出力（有効時）
  excel: true                    # Excel出力（有効時）
  include_watchlist: true        # Excelにウォッチリストシート追加
  columns: null                  # 出力カラム（nullならデフォルトカラム使用）

# ==============================================================================
# UI SETTINGS
# ==============================================================================
ui:
  default_language: "ja"         # デフォルト言語 (ja/en)
  chart_days: 120                # チャート表示日数
  news_limit: 8                  # 表示ニュース数